[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output settings
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage settings (optional, uncomment to enable)
# addopts =
#     -v
#     --tb=short
#     --strict-markers
#     --cov=.
#     --cov-report=term-missing
#     --cov-report=html

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take a long time to run